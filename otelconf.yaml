file_format: "1.0"
disabled: false
log_level: info

logger_provider:
  processors:
    - simple:
        exporter:
          otlp_grpc:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
            insecure: true
            headers:
              - name: x-honeycomb-team
                value: ${HONEYCOMB_API_KEY}

# Configure tracer provider.
tracer_provider:
  processors:
    - simple:
        exporter:
          otlp_grpc:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
            insecure: true
            headers:
              - name: x-honeycomb-team
                value: ${HONEYCOMB_API_KEY}